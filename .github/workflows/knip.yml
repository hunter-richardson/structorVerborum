name: knip
on: push

jobs:
  knip:
    runs-on: ubuntu-latest
    name: knip
    steps:
      - name: vellere
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - name: tollere
        uses: pnpm/action-setup@5eea8caf49c844361c1e9ddc1324e179c54b58e9
        with:
          version: 12
          runtime: node@26
          install: true
      - name: agere
        run: pnpm knip
