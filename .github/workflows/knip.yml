name: knip
on: push

jobs:
  knip:
    runs-on: ubuntu-latest
    name: knip
    steps:
      - name: vellere
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - name: tollere
        uses: pnpm/setup@4a44b91655ebbe28915ef7523b27a4020e18f988
        with:
          version: 12
          runtime: node@26
          install: true
      - name: agere
        run: pnpm knip
