# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# ESLint is a tool for identifying and reporting on patterns
# found in ECMAScript/JavaScript code.
# More details at https://github.com/eslint/eslint
# and https://eslint.org

name: ESLint

on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, edited, ready_for_review, review_requested, auto_merge_enabled]
    paths-ignore: [.github, README.md, LICENSE.md]
  push:
    paths-ignore: [.github, README.md, LICENSE.md]

jobs:
  eslint:
    name: Run eslint scanning
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      # contents: read
      # actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - name: Install dependencies
        run: |
          ESLINT_VER=$(pnpm pkg get devDependencies.eslint | tr -cd '0-9.' | xargs)
          SARIF_VER=$(pnpm pkg get 'devDependencies["@microsoft/eslint-formatter-sarif"]' | tr -cd '0-9.' | xargs)
          npm install eslint@$ESLINT_VER @microsoft/eslint-formatter-sarif@$SARIF_VER --ignore-scripts

      - name: Run ESLint
        run: npx --no-install eslint . \
          --config eslint.config.ts \
          --format @microsoft/eslint-formatter-sarif \
          --output-file eslint-results.sarif
        continue-on-error: false

      - name: Upload analysis results to GitHub
        uses: github/codeql-action/upload-sarif@f0489abddd4e5e9dff53ed28a45b1d6f88978a1b
        with:
          sarif_file: eslint-results.sarif
          wait-for-processing: true
