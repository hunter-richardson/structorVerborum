name: expedire

on:
  workflow_run:
    workflows: [aedificare]
    branches: [princeps]
    types: [completed]

jobs:
  on-success:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: aedificare
        uses: ./.github/workflows/aedificare.yaml
      - name: inaugurare
        run: |
          VUECLI_VER=$(pnpm pkg get 'devDependencies["@vue/cli"]' | tr -cd '0-9.' | xargs)
          pnpm add -D @vue/cli@$VUECLI_VER --ignore-scripts

#      - name: expedire
#        run: npm run deploy
