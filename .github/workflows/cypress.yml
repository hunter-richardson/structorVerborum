name: Cypress

on:
  workflow_dispatch:
  push:
    branches-ignore: ['princeps']
  pull_request:
    branches-ignore: ['princeps']
jobs:
  cypress:
    runs-on: ubuntu-latest
    steps:
      - name: sarcere
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - name: parare
        run: mkdir -p cypress/logs
      - name: agere
        uses: cypress-io/github-action@207a8be0f8937a6587fa45d1fde56f66dcc85566
        with:
          build: pnpm debug 2>&1 | tee cypress/logs/tentamina.log
          start: pnpm start 2>&1 | tee cypress/logs/tentamina.log
          wait-on: 'https://localhost:4173'
      - name: colligere
        if: always()
        shell: bash
        run: |
          if [ -d nuntia ]; then
            scp -v $(find nuntia -type f -name '*.log') cypress/logs/
          else
            printf 'Nuntia nulla generata sunt\n'
          fi
      - name:
        uses: actions/upload-artifact@0c366cb4fc8897159c94880f94b55bc716ad6a66
        if: always()
        with:
          name: cypress-artifacts
          if-no-files-found: warn
          path: |
            cypress/screenshots
            cypress/videos
            cypress/logs
