name: aedificare

on:
  workflow_dispatch: null
  workflow_run:
    workflows:
      - ESLint
    types:
      - completed
jobs:
  on-success:
    runs-on: ubuntu-latest
    name: aedificare
    continue-on-error: false
    strategy:
      fail-fast: true
    steps:
      - name: vellere
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 0
      - name: tollere
        uses: pnpm/setup@5eea8caf49c844361c1e9ddc1324e179c54b58e9
        with:
          version: 12
          runtime: node@26
          install: true
      - name: verificare
        run: pnpm lint && pnpm typecheck
      - name: struere
        run: pnpm release
      - name: invenire
        run: . ${{ github.workspace }}/src/scriptura/invenire.sh
