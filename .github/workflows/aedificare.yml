name: aedificare

on:
  push:
    branches:
      - princeps

jobs:
  OSV:
    uses: ./.github/workflows/OSV.yml
    permissions:
      security-events: write
      contents: read
      actions: read
  SonarQube:
    uses: ./.github/workflows/sonarqube.yml
    permissions:
      pull-requests: write
      contents: read
      checks: write
  aedificare:
    needs:
      - OSV
      - SonarQube
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
    steps:
      - name: vellere
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 0
      - name: tollere
        uses: pnpm/setup@4a44b91655ebbe28915ef7523b27a4020e18f988
        with:
          version: 12
          runtime: node@26
          install: true
      - name: verificare
        run: pnpm lint && pnpm typecheck
      - name: struere
        run: pnpm release
      - name: invenire
        run: . ${{ github.workspace }}/src/scriptura/invenire.sh
