an:
  suffixum:
    plurale: "s"
  categoriae:
    actus_singularis: "verb"
    actus_pluralis: "$(categoriae.actus_singularis)$(suffixum.plurale)"
    adiectivum_singularis: "adiective"
    adiectivum_pluralis: "$(categoriae.adiectivum_singularis)$(suffixum.plurale)"
    adverbium_singularis: "adverb"
    adverbium_pluralis: "$(categoriae.adveribum_singularis)$(suffixum.plurale)"
    categoria_radix: "categor"
    categoria_singularis: "$(categoriae.categoria_radix)y"
    categoria_plurallis: "$(categoriae.categoria_radix)ie$(suffixum.plurale)"
    coniunctio_singularis: "conjunction"
    coniunctio_pluralis: "$(categoriae.coniunctio_singularis)$(suffixum.plurale)"
    encliticum_singularis: "enclitic"
    encliticum_pluralis: "$(categoriae.encliticum_singularis)$(suffixum.plurale)"
    lemma_singularis: "term"
    lemma_pluralis: "$(categoriae.lemma_singularis)$(suffixum.plurale)"
    nomen_singularis: "noun"
    nomen_pluralis: "$(categoriae.nomen_singularis)$(suffixum.plurale)"
    numeramen_singularis: "numeral"
    numeramen_pluralis: "$(categoriae.numeramen_singularis)$(suffixum.plurale)"
    participium_singularis: "pariciple"
    participium_pluralis: "$(categoriae.paricipium_singularis)$(suffixum.plurale)"
    praepositio_singularis: "preposition"
    praepositio_pluralis: "$(categoriae.praepositio_singularis)$(suffixum.plurale)"
    pronomen_singularis: "pro$(categoriae.nomen_singularis)"
    pronomen_pluralis: "$(categoriae.pronomen_singularis)$(suffixum.plurale)"
  annuli:
    appositus:
      quaerere: "Search"
      numerare: "Enumerate"
      calculare: "Calculate"
      assentire: "Agree"
      negare: "Deny"
      colloqui: "Let's talk!"
    quaerere:
      aperire: "Open"
      sarcire: "Search"
      seligere: "I'm Feeling Lucky'"
    inflectere:
      aForte: "$(annuli.quaerere.seligere)"
      aMemet: "Inflect"
      probare: "Substantiate"
    specere:
      addere: "Add this to my phrase"
      addereProprium: "$(annuli.specere.addere) as a proper name"
      adire: "$(annuli.quaerere.aperire)"
  errores:
    soli: "only"
    licuntur: "allowed!"
    numerare:
      deNumeris: "$(soli, capitalize) Arabic numerals $(errores.licuntur)"
    quaerere:
      deLitteris: "$(soli, capitalize) Latin letters $(errores.licuntur)"
  scripta:
    404:
      titula: "Absent Page"
      caput: "Oops, 404!"
      nuntium: "The requested resource is missing"
      actum: "Go Back"
    onerare:
      oneratur:  "loading..."
      onerans:
        singularis: "$({{pittacium}}_singularis, capitalize) $(scripta.onerare.oneratur)"
        plurale: "$({{pittacium}}_singularis, capitalize) $(scripta.onerare.oneratur)"
    appositus:
      titula: "Phrase Factory"
      rogatum: "What would you like to do or say?"
      deCrustulis: |
        - Here cookies are used so that you may choose details for your own experience; or you can choose not to store cookies and use the site unchanged in this case, the only cookie stored would be your refusal of them.
        -
        - Note that most of these cookies will modify the method of generating phrases, so switching them back-and-forth between modes will be unreliable.
