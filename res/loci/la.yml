la:
  suffixa:
    primum:
      plurale: "e"
    secundum:
      masculinum:
        singulare: "us"
        plurale: "i"
      neutrum:
        singulare:  "um"
        plurale: "a"
    tertium:
      animale:
        plurale: "es"
      inanimale:
        plurale: "$t(suffixa.secundum.neutrum.plurale)"
  partes:
    actus: "act$t(suffixa.secundum.masculinum.singulare)"
    actus_singulare: "$t(partes.actus)"
    actus_plurale: "$t(partes.actus)"
    adiectivum_radix: "adiectiv"
    adiectivum_singulare: "$t(partes.adiectivum_radix)$t(suffixa.secundum.neutrum.singulare)"
    adiectivum_plurale: "$t(partes.adiectivum_radix)$t(suffixa.secundum.neutrum.plurale)"
    adverbium_radix: "adverbi"
    adverbium_singulare: "$t(partes.adverbium_radix)$t(suffixa.secundum.neutrum.singulare)"
    adverbium_plurale: "$t(partes.adverbium_radix)$t(suffixa.secundum.neutrum.plurale)"
    categoria_singulare: "categori$t(suffixa.secundum.neutrum.plurale)"
    categoria_plurallis: "$t(partes.categoria_singulare)$t(suffixa.primum.plurale)"
    casus_radix: "cas$t(suffixa.secundum.masculinum.singulare)"
    casus_singulare: "$t(partes.casus_radix)"
    casus_pluralis: "$t(partes.casus_radix)"
    coniunctio_singulare: "coniunctio"
    coniunctio_plurale: "$t(partes.coniunctio)n$t(suffixa.tertium.animale.plurale)"
    factum_radix: "fact"
    factum_singulare: "$t(partes.factum_radix)$t(suffixa.secundum.neutrum.singulare)"
    factum_plurale: "$t(partes.factum_radix)$t(suffixa.secundum.neutrum.plurale)"
    genus_radix: "gen"
    genus_singulare: "$t(partes.genus_radix)$t(suffixa.secundum.neutrum.singulare)"
    genus_plurale: "$t(partes.genus_radix)er$t(suffixa.tertium.inanimale.plurale)"
    gradus_radix: "grad$t(suffixa.secundum.masculinum.singulare)"
    gradus_singulare: "$t(gradus_radix)"
    gradus_plurale: "$t(gradus_radix)"
    encliticum_radix: "enclitic"
    encliticum_singulare: "$t(partes.encliticum_radix)$t(suffixa.secundum.neutrum.singulare)"
    encliticum_plurale: "$t(partes.encliticum_radix)$t(suffixa.secundum.neutrum.plurale)"
    infinitivum_radix: "infintiv"
    modus_radix: "mod"
    modus_singulare: "$t(partes.modus_radix)$t(suffixa.secundum.masculinum.singulare)"
    modus_plurale: "$t(partes.modus_radix)$t(suffixa.secundum.masculinum.plurale)"
    lemma_singulare: "lemm$t(suffixa.secundum.neutrum.plurale)"
    lemma_plurale: "$t(partes.lemma_singulare)$t(suffixa.primum.plurale)"
    nomen_radix: "nom"
    nomen_singulare: "$t(partes.nomen_radix)en"
    nomen_plurale: "$t(partes.nomen_radix)in$t(suffixa.tertium.inanimale.plurale)"
    nullum_radix: "null"
    numeramen_radix: "numeram"
    numeramen_singulare: "$t(partes.numeramen_radix)en"
    numeramen_plurale: "$t(partes.numeramen_radix)in$t(suffixa.tertium.inanimale.plurale)"
    numerus_radix: "numer"
    numerus_singulare: "$t(partes.numerus_radix)$(suffixa.secundum.masculinum.singulare)"
    numerus_plurale: "$t(partes.numerus_radix)$(suffixa.secundum.masculinum.plurale)"
    participium_radix: "participi"
    participium_singulare: "$t(partes.paricipium_radix)$t(suffixa.secundum.neutrum.singulare)"
    participium_plurale: "$t(partes.paricipium_radix)$t(suffixa.secundum.neutrum.plurale)"
    persona_singulare: "person$t(suffixa.secundum.neutrum.plurale)"
    persona_plurale: "$t(partes.persona_singulare)$(suffixa.primum.plurale)"
    praepositio_singulare: "praepositio"
    praepositio_plurale: "$t(partes.praepositio_singulare)n$t(suffixa.tertium.animale.plurale)"
    pronomen_singulare: "pro$t(partes.nomen_singulare)"
    pronomen_plurale: "pro$t(partes.nomen_plurale)"
    referendum_radix: "referend"
    referendum_singulare: "$t(partes.referendum_radix)$(suffixa.secundum.neutrum.singulare)"
    referendum_plurale: "$t(partes.referendum_radix)$(suffixa.secundum.neutrum.plurale)"
    tempus_radix: "temp"
    tempus_singulare: "$t(partes.tempus_radix)$t(suffixa.secundum.masculinum.singulare)"
    tempus_plurale: "$t(partes.tempus_radix)or$t(suffixa.teritum.inanimale.plurale)"
    vox_radix: "vo"
    vox_singulare: "$t(partes.vox_radix)x"
    vox_plurale: "$t(partes.vox_radix)c$t(suffixa.tertium.animale.plurale)"
    casus:
      derectus: "derect$t(suffixa.secundum.masculinum.singulare)"
      nominativus: "nominativ$t(suffixa.secundum.masculinum.singulare)"
      genitivus: "genitiv$t(suffixa.secundum.masculinum.singulare)"
      dativus: "dativ$t(suffixa.secundum.masculinum.singulare)"
      accusativus: "accusativ$t(suffixa.secundum.masculinum.singulare)"
      ablativus: "ablativ$t(suffixa.secundum.masculinum.singulare)"
      vocativus: "vocativ$t(suffixa.secundum.masculinum.singulare)"
      locativus: "locativ$t(suffixa.secundum.masculinum.singulare)"
    facta:
      nullum: "$t(partes.nullum_radix)$t(suffixa.secundum.neutrum.singulare)"
      infinitivum: "$t(partes.infinitivum_radix)$t(suffixa.secundum.neutrum.singulare)"
      gerundium: "gerund$t(suffixa.secundum.neutrum.singulare)"
      supinum: "supin$t(suffixa.secundum.neutrum.singulare)"
    genera:
      neutrum: "neutr$t(suffixa.secundum.neutrum.singulare)"
      masculinum: "masculin$t(suffixa.secundum.neutrum.singulare)"
      femininum: "feminin$t(suffixa.secundum.neutrum.singulare)"
    gradus:
      positivus: "positiv$t(suffixa.secundum.masculinum.singulare)"
      comparativus: "comparativ$t(suffixa.secundum.masculinum.singulare)"
      superlativus: "superlativ$t(suffixa.secundum.masculinum.singulare)"
    modus:
      infinitivus: "$t(partes.infinitivum_radix)$t(suffixa.secundum.masculinum.singulare)"
      subiunctivus: "subiunctiv$t(suffixa.secundum.masculinum.singulare)"
      imperativus: "imperativ$t(suffixa.secundum.masculinum.singulare)"
      participium: "$t(partes.participium_singulare)"
    numeri:
      nullus: "$t(partes.nullum_radix)$t(suffixa.secundum.masculinum.singulare)"
      singularis: "singularis"
      pluralis: "pluralis"
    personae:
      nulla: "$t(partes.nullum_radix)$t(suffixa.secundum.neutrum.plurale)"
      prima: "prim$t(suffixa.secundum.neutrum.plurale)"
      secunda: "secund$t(suffixa.secundum.neutrum.plurale)"
      tertia: "terti$t(suffixa.secundum.neutrum.plurale)"
    referenda:
      numerus: "$t(suffixa.secundum.masculinum.singulare)"
      ordinale: "ordinale"
      cardinale: "cardinale"
      adverbium: "$t(partes.adverbium_singulare)"
      multiplicativum: "multiplicativ$t(suffixa.secundum.neutrum.singulare)"
      distributivum: "distributiv$t(suffixa.secundum.neutrum.singulare)"
      fractionale: "fractionale"
    tempus:
      nullum: "$t(partes.facta.nullum)"
      praesens: "praesens"
      infectum: "infect$t(suffixa.secundum.masculinum.singulare)"
      futurum: "futur$t(suffixa.secundum.masculinum.singulare)"
      perfectum: "perfect$t(suffixa.secundum.masculinum.singulare)"
      plusquamperfectum: "plusquam$t(partes.tempus.perfectum)"
      exigendum: "exigend$t(suffixa.secundum.masculinum.singulare)"
    voces:
      nulla: "$t(partes.personae.nullum)"
      activa: "activ$t(suffixa.secundum.neutrum.plurale)"
      passiva: "passiv$t(suffixa.secundum.neutrum.plurale)"
  annuli:
    fors: "fors"
    appositus:
      quaerere: "Quaerere"
      numerare: "Numerare"
      calculare: "Calculare"
      assentire: "Assentio"
      negare: "Nego"
      colloqui: "Colloquamur"
    quaerere:
      aperire: "Aperi"
      sarcire: "Sarci"
      seligere: "$t(annuli.fors, capitalize) Seligat"
    tabulare:
      aForte: "$t(annuli.fors, capitalize) Inflectat"
      aMemet: "Inflecte"
      probare: "Probetur"
    specere:
      addere: "Adde hoc locutioni"
      addereProprium: "$t(annuli.specere.addere) ut proprium"
      aperire: "$t(annuli.quaerere.aperire)"
  errores:
    licuntur: "licuntur"
    numerare:
      deNumeris: "Arabici numeri soli $tt(errores.licuntur)"
    quaerere:
      deLitteris: "Latinae litterae solae $tt(errores.licuntur)"
  scripta:
    404:
      caput: "Vae CDIV"
      titula: "Absens Pagina"
      nuntium: "Quaerenda res abest"
      actum: "Recipe"
    onerare:
      onerans: "$tt({{pittacium}}_plurale, capitalize) onerantur..."
    inflectere:
      actus:
        actor: "actor"
        actrix: "actrix"
    appositus:
      titula: "Structor Verborum"
      rogatum: "Quid agere loquive velles"
      deCrustulis: |
        - Hic crustula utantur ut singulas opteris pro usu tibi, aut crustula condita negare optares et situm immutatum utereris, atque solum crustulum conditum erit renutus eorum.
        -
        - Noteris quod crustula plura mutabunt modum pariendo locutionum ergo infidum esset vertere huc illucque.
