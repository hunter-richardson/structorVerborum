la:
  suffixa:
    primum:
      plurale: "e"
    secundum:
      neutrum:
        singulare:  "um"
        plurale: "a"
    tertium:
      animalis:
        plurale: "nes"
      inanimalis:
        singulare: "en"
        plurale: "ina"
  categoriae:
    actus: "actus"
    actus_singularis: "$(categoriae.actus)"
    actus_pluralis: "$(categoriae.actus)"
    adiectivum_radix: "adiectiv"
    adiectivum_singularis: "$(categoriae.adiectivum_radix)$(suffixa.secundum.neutrum.singulare)"
    adiectivum_pluralis: "$(categoriae.adiectivum_radix)$(suffixa.secundum.neutrum.plurale)"
    adverbium_radix: "adverbi"
    adverbium_singularis: "$(categoriae.adverbium_radix)$(suffixa.secundum.neutrum.singulare)"
    adverbium_pluralis: "$(categoriae.adverbium_radix)$(suffixa.secundum.neutrum.plurale)"
    categoria_singularis: "categoria"
    categoria_plurallis: "$(categoriae.categoria_singularis)$(suffixa.prima.plurale)"
    coniunctio_singularis: "coniunctio"
    coniunctio_pluralis: "$(categoriae.coniunctio)$(suffixa.tertium.animalis.plurale)"
    encliticum_radix: "enclitic"
    encliticum_singularis: "$(categoriae.encliticum_radix)um"
    encliticum_pluralis: "$(categoriae.encliticum_radix)a"
    lemma_singularis: "lemma"
    lemma_pluralis: "$(categoriae.lemma_singularis)$(suffixa.prima.plurale)"
    nomen_radix: "nom"
    nomen_singularis: "$(categoriae.nomen_radix)$(suffixa.tertium.inanimalis.singulare)"
    nomen_pluralis: "$(categoriae.nomen_radix)$(suffixa.tertium.inanimalis.plurale)"
    numeramen_radix: "numeram"
    numeramen_singularis: "$(categoriae.numeramen_radix)$(suffixa.tertium.inanimalis.singulare)"
    numeramen_pluralis: "$(categoriae.numeramen_radix)$(suffixa.tertium.inanimalis.plurale)"
    participium_radix: "participi"
    participium_singularis: "$(categoriae.paricipium_radix)um"
    participium_pluralis: "$(categoriae.paricipium_radix)a"
    praepositio_singularis: "praepositio"
    praepositio_pluralis: "$(categoriae.praepositio_singularis)$(suffixa.tertium.animalis.plurale)"
    pronomen_singularis: "pro$(categoriae.nomen_singularis)"
    pronomen_pluralis: "pro$(categoriae.nomen_pluralis)"
  annuli:
    fors: "fors"
    appositus:
      quaerere: "Quaerere"
      numerare: "Numerare"
      calculare: "Calculare"
      assentire: "Assentio"
      negare: "Nego"
      colloqui: "Colloquamur"
    quaerere:
      aperire: "Aperi"
      sarcire: "Sarci"
      seligere: "$(annuli.fors, capitalize) Seligat"
    inflectere:
      aForte: "$(annuli.fors, capitalize) Inflectat"
      aMemet: "Inflecte"
      probare: "Probetur"
    specere:
      addere: "Adde hoc locutioni"
      addereProprium: "$(annuli.specere.addere) ut proprium"
      aperire: "$(annuli.quaerere.aperire)"
  errores:
    licuntur: "licuntur"
    numerare:
      deNumeris: "Arabici numeri soli $t(errores.licuntur)"
    quaerere:
      deLitteris: "Latinae litterae solae $t(errores.licuntur)"
  scripta:
    ellipsis: "..."
    404:
      caput: "Vae CDIV"
      titula: "Absens Pagina"
      nuntium: "Quaerenda res abest"
      actum: "Recipe"
    onerare:
      onerans:
        singulare: "$t({{pittacium}}_singularis, capitalize) oneratur$(scripta.ellipsis)"
        plurale: "$t({{pittacium}}_pluralis, capitalize) onerantur$(scripta.ellipsis)"
    appositus:
      titula: "Structor Verborum"
      rogatum: "Quid agere loquive velles"
      deCrustulis: |
        - Hic crustula utantur ut singulas opteris pro usu tibi, aut crustula condita negare optares et situm immutatum utereris, atque solum crustulum conditum erit renutus eorum.
        -
        - Noteris quod crustula plura mutabunt modum pariendo locutionum ergo infidum esset vertere huc illucque.
